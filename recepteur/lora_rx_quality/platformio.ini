; Test de QUALITE DE RECEPTION LoRa 2.4 GHz (SX1281) de la LiXee-Box.
;
; Firmware autonome, flashe a la place du firmware principal le temps du test :
;   - ecoute PASSIVE : il n'emet rien, le protocole et le firmware du ZLinky LoRa sont inchanges ;
;   - relit la configuration d'appairage de la box (/config/lora.json : canal, SF, cles) pour
;     identifier les trames du ZLinky par leur MIC, sans jamais ecrire ni formater LittleFS ;
;   - affiche en serie (115200 bauds) RSSI, SNR, trames perdues et un bilan periodique.
;
; Build / flash / moniteur, depuis la racine du projet principal :
;   pio run -d recepteur/lora_rx_quality -t upload
;   pio device monitor -b 115200
;
; Retour au firmware normal : reflasher le firmware principal (pio run -t upload a la racine).
; La table de partitions est IDENTIQUE a celle du firmware principal : LittleFS (appareils,
; configuration, appairage LoRa) est conserve tel quel.

[platformio]
boards_dir = ../../boards

[env:lora_rx_quality]
platform = espressif32@6.12.0
board = esp32LixeeTft
framework = arduino
board_build.partitions = large_spiffs_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCORE_DEBUG_LEVEL=0
	; aes128.h (AES-128 CTR + CMAC) partage avec le recepteur de test : recepteur/aes128.h
	-I..
lib_deps =
	jgromes/RadioLib@^7.1.0
	bblanchon/ArduinoJson@^6.21.3
